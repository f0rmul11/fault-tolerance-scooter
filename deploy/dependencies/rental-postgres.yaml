apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rental-db-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rental-postgres
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rental-postgres
  ports:
    - name: postgres
      nodePort: 30432
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rental-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rental-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rental-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.10-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: rental
            - name: POSTGRES_USER
              value: rental
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rental-database
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            exec:
              command: [pg_isready, -U, rental, -h, "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, rental, -h, "127.0.0.1"]
            periodSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rental-db-data
