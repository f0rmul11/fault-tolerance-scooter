apiVersion: v1
kind: Service
metadata:
  name: profile
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: profile
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
      nodePort: 30094
---
apiVersion: v1
kind: Service
metadata:
  name: profile-admin
spec:
  type: NodePort
  # Keep diagnostics reachable while the application is not ready for traffic.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: profile
  ports:
    - name: admin
      port: 8081
      targetPort: admin
      nodePort: 30085
