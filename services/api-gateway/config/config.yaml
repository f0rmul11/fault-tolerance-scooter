graceful:
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

service:
  profile: "profile:9090"
  scooter: "scooter:9090"
  rental: "rental:9090"
  pricing: "pricing:9090"

retry:
  __default__:
    enabled: false
    separate_retry_per_handler_enabled: true
    max_attempts: 5
    initial_backoff: 20ms
    max_backoff: 250ms
    backoff_multiplier: 2
    retryable_codes: [Unavailable]
    throttler:
      throttling_enabled: true
      throttle_max_tokens: 1000
      throttle_token_ratio: 0.5
  handlers:
    - method: /scooter.scooter.v1.ScooterService/GetScooter
      enabled: true


# Для локального запуска через make config-etcd. В k3s endpoint задан в Deployment.
runtime_config:
  endpoints: ["http://127.0.0.1:2379"]
  prefix: /scooterflow/dev/services/api-gateway/rtconfig/v1/values/
  schema_path: rtconfig.yaml
  startup_timeout: 5s
  shutdown_timeout: 3s
