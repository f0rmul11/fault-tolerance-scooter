syntax = "proto3";

package api_gateway.scooter.v1;

import "google/api/annotations.proto";

option go_package = "api-gateway/internal/pkg/pb/api-gateway/scooter/v1;scooterV1";

// API области scooter.
service ScooterService {
  // Читает карточку по UUID.
  rpc GetScooter(GetScooterRequest) returns (GetScooterResponse) {
    option (google.api.http) = {get: "/v1/scooters/{scooter_id}"};
  }

  // Читает страницу справочника.
  rpc ListScooters(ListScootersRequest) returns (ListScootersResponse) {
    option (google.api.http) = {get: "/v1/scooters"};
  }

  // Обновляет доступность для новых бронирований с проверкой версии.
  rpc UpdateScooterAvailability(UpdateScooterAvailabilityRequest) returns (UpdateScooterAvailabilityResponse) {
    option (google.api.http) = {
      patch: "/v1/scooters/{scooter_id}/availability"
      body: "*"
    };
  }

  // Обновляет название владельца — юридического лица с проверкой версии.
  rpc UpdateScooterOwner(UpdateScooterOwnerRequest) returns (UpdateScooterOwnerResponse) {
    option (google.api.http) = {
      patch: "/v1/scooters/{scooter_id}/owner"
      body: "*"
    };
  }
}

// Scooter: транспортное представление данных.
message Scooter {
  // UUID самоката; не совпадает с номером на корпусе.
  string id = 1;

  // Уникальный номер на корпусе.
  string number = 2;

  // Марка самоката.
  string brand = 3;

  // Общий наезд в секундах; часы = секунды / 3600.
  int64 ridden_seconds = 5;

  // Версия записи.
  int64 version = 6;

  // Время обновления, RFC3339 UTC.
  string updated_at = 7;

  // Разрешены ли новые бронирования; занятость проверяет Rental.
  bool is_active = 8;

  // Название владельца — юридического лица.
  string owner = 9;
}

// GetScooterRequest: параметры запроса.
message GetScooterRequest {
  // UUID запрашиваемой записи.
  string scooter_id = 1;
}

// GetScooterResponse: результат операции.
message GetScooterResponse {
  // Найденная запись.
  Scooter scooter = 1;
}

// ListScootersRequest: параметры запроса.
message ListScootersRequest {
  // Размер страницы: по умолчанию 20, максимум 100.
  int32 limit = 1;

  // Число пропускаемых строк; неотрицательное.
  int32 offset = 2;
}

// ListScootersResponse: результат операции.
message ListScootersResponse {
  // Страница записей в стабильном порядке UUID.
  repeated Scooter scooters = 1;
}

// UpdateScooterAvailabilityRequest: параметры точечного обновления.
message UpdateScooterAvailabilityRequest {
  // UUID самоката.
  string scooter_id = 1;

  // Версия, прочитанная перед обновлением.
  int64 expected_version = 2;

  // Обязательный флаг; false явно запрещает новые бронирования.
  optional bool is_active = 3;
}

// UpdateScooterAvailabilityResponse: карточка после сохранения.
message UpdateScooterAvailabilityResponse {
  // Сохранённый самокат.
  Scooter scooter = 1;
}

// UpdateScooterOwnerRequest: параметры точечного обновления.
message UpdateScooterOwnerRequest {
  // UUID самоката.
  string scooter_id = 1;

  // Версия, прочитанная перед обновлением.
  int64 expected_version = 2;

  // Непустое название юридического лица, до 200 символов.
  string owner = 3;
}

// UpdateScooterOwnerResponse: карточка после сохранения.
message UpdateScooterOwnerResponse {
  // Сохранённый самокат.
  Scooter scooter = 1;
}
