{
  "version": "v2",
  "clean": true,
  "plugins": [
    {
      "local": "protoc-gen-go",
      "out": "internal/pkg/pb/external",
      "opt": "paths=source_relative"
    },
    {
      "local": "protoc-gen-go-grpc",
      "out": "internal/pkg/pb/external",
      "opt": "paths=source_relative"
    }
  ],
  "inputs": [
    {
      "directory": "../profile/api",
      "paths": [
        "../profile/api/profile/profile/v1/profile.proto"
      ]
    },
    {
      "directory": "../scooter/api",
      "paths": [
        "../scooter/api/scooter/scooter/v1/scooter.proto"
      ]
    },
    {
      "directory": "../rental/api",
      "paths": [
        "../rental/api/rental/rental/v1/rental.proto"
      ]
    },
    {
      "directory": "../pricing/api",
      "paths": [
        "../pricing/api/pricing/pricing/v1/pricing.proto"
      ]
    }
  ]
}
