graceful:
  timeout: 10s

grpc_server:
  port: 9090
  max_connection_idle: 5m
  max_connection_age: 30m
  timeout: 5s
  time: 2h

http_server:
  port: 8080
  admin_port: 8081

service:
  scooter: "scooter:9090"

postgres_dsn: "postgres://rental:rental-local@rental-postgres:5432/rental?sslmode=disable"
postgres:
  max_connections: 10
  min_connections: 0
  max_idle_connections: 0
  max_conn_lifetime: 1h

kafka_brokers: ["kafka:9092"]
outbox:
  limits:
    locked_keys_limit: 100
    messages_limit: 100
    max_err_count_for_message: 10
  topics:
    rental.events.v1:
      batch_size: 50
      worker:
        interval: 1s
        concurrency: 1
